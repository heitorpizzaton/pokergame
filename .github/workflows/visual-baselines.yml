name: Update visual baselines

# Regenerates the table screenshots (tests/visual) with the official Playwright Chromium and
# commits them to the pull request's branch. Adding the label is the approval of the new
# baselines; review the committed images in the PR diff (ADR-023).
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-visual-baselines'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run visual -- --update-snapshots=all
      - name: Commit the baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            exit 0
          fi
          git commit -m "test(visual): update table baselines"
          git push
