name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run budget

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check for baselines
        id: baselines
        run: |
          if compgen -G "tests/visual/__screenshots__/*/*.png" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No visual baselines yet. Add the update-visual-baselines label to the PR to create them."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.baselines.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.baselines.outputs.present == 'true'
        run: npm ci
      - if: steps.baselines.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.baselines.outputs.present == 'true'
        run: npm run visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
